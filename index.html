<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSD Fruit Slice - Katana Edition</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MediaPipe Gerekli Kütüphaneler -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="game-container">
        <!-- Oyun Alanı -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Canlı Kamera Görünümü (Sağ Alt Köşe) -->
        <video id="input_video" class="input_video" autoplay playsinline></video>
        
        <!-- UI Öğeleri -->
        <div id="ui">
            <div class="score">PUAN: <span id="scoreVal">0</span></div>
            <div class="lives">CAN: <span id="livesVal">3</span></div>
        </div>
        
        <div id="game-over" class="hidden">
            <h1>OYUN BİTTİ</h1>
            <p>Skorun: <span id="finalScoreVal">0</span></p>
            <button onclick="resetGame()">Tekrar Oyna</button>
        </div>
        
        <div id="loading">
            <h2>HSD Katana Slice Yükleniyor...</h2>
            <p>Lütfen kameraya izin verin ve elinizi gösterin.</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
